# mise.toml: tasks for developing the template itself

[tools]
uv = "latest"
actionlint = "latest"
shellcheck = "latest"

[tasks.test-scripts]
description = "Test the check scripts and the Claude Code hook in throwaway repos"
run = "bash tests/check-scripts.sh"

[tasks.test]
description = "Test the check scripts, then render the template for each stack and context and check each render"
depends = ["test-scripts"]
run = "bash tests/render.sh"
