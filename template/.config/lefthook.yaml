# Git hooks. Installed by `mise run install`.
#
# pre-commit stays fast (lint, format, file size and fan-out only). Anything slow enough to make
# you reach for --no-verify belongs in pre-push instead.

commit-msg:
  commands:
    cog:
      run: mise exec -- cog verify --file {1} --ignore-merge-commits --ignore-fixup-commits

pre-commit:
  commands:
    lint:
      run: mise run lint
    file-size:
      run: scripts/check-file-size {staged_files}
    fan-out:
      run: scripts/check-fan-out {staged_files}

pre-push:
  commands:
    test:
      run: mise run test
    check-commits:
      run: mise run check-commits
    file-size:
      run: scripts/check-file-size
    fan-out:
      run: scripts/check-fan-out --all
